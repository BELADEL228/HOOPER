<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24070B" />
      <stop offset="45%" stop-color="#0F121C" />
      <stop offset="100%" stop-color="#05060A" />
    </linearGradient>
    <linearGradient id="flameGrad512" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF1E32" />
      <stop offset="40%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
    <linearGradient id="fireCrownGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF2A3B" />
      <stop offset="60%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FFFDF0" />
    </linearGradient>
    <filter id="glow512" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FF2A3B" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Fond PWA 512 avec bordure lumineuse -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" stroke="#FF2A3B" stroke-width="6" stroke-opacity="0.45"/>

  <!-- Halo de braises en fond -->
  <circle cx="256" cy="270" r="150" fill="#FF2A3B" opacity="0.18" filter="url(#glow512)"/>
  <circle cx="256" cy="270" r="110" fill="#FFB800" opacity="0.15" filter="url(#glow512)"/>

  <!-- Ballon de Basketball Central -->
  <circle cx="256" cy="270" r="122" fill="url(#flameGrad512)" filter="url(#shadow512)"/>

  <!-- Lignes du ballon de Basket -->
  <path d="M 134 270 Q 256 270 378 270" stroke="#090A0F" stroke-width="9" stroke-linecap="round" opacity="0.8" fill="none"/>
  <path d="M 256 148 Q 256 270 256 392" stroke="#090A0F" stroke-width="9" stroke-linecap="round" opacity="0.8" fill="none"/>
  <path d="M 168 185 Q 256 270 168 355" stroke="#090A0F" stroke-width="8" stroke-linecap="round" opacity="0.7" fill="none"/>
  <path d="M 344 185 Q 256 270 344 355" stroke="#090A0F" stroke-width="8" stroke-linecap="round" opacity="0.7" fill="none"/>

  <!-- Flammes dynamiques supérieures -->
  <path d="M 256 70 C 235 112 215 142 230 174 C 204 142 198 116 204 95 C 178 132 172 174 194 210 C 162 195 156 164 162 144 C 135 185 140 236 182 272 C 145 252 129 216 135 190 C 114 231 124 288 166 324 C 150 314 140 293 140 272 C 124 324 166 370 224 380 C 204 365 194 344 198 318 C 220 350 251 365 288 360 C 262 340 256 314 262 293 C 288 324 324 334 360 314 C 339 298 329 277 334 251 C 365 282 392 272 397 241 C 376 246 360 236 355 215 C 381 231 397 210 392 179 C 376 195 355 195 344 180 C 365 164 370 128 349 98 C 339 128 318 144 303 133 C 318 102 303 77 282 61 C 288 92 272 118 251 123 C 262 97 267 76 256 70 Z"
        fill="url(#fireCrownGrad)" opacity="0.9" filter="url(#glow512)"/>

  <!-- Monogramme central FIRE STONE -->
  <text x="256" y="296" font-family="'Impact', 'Outfit', sans-serif" font-size="92" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="-3" style="filter: drop-shadow(0 6px 12px rgba(0,0,0,0.85));">
    FS
  </text>
  
  <!-- Ruban / Bannière inférieure -->
  <rect x="136" y="424" width="240" height="42" rx="21" fill="#FF2A3B" fill-opacity="0.2" stroke="#FFB800" stroke-width="2" stroke-opacity="0.8"/>
  <text x="256" y="451" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="#FFB800" letter-spacing="4">
    FIRE STONE
  </text>
</svg>
