<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A070B" />
      <stop offset="50%" stop-color="#0B0D14" />
      <stop offset="100%" stop-color="#05060A" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF2A3B" />
      <stop offset="50%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="100%" stop-color="#FF8C00" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF2A3B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fond arrondi PWA -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#FF2A3B" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Aura flamboyante -->
  <circle cx="96" cy="100" r="54" fill="#FF2A3B" opacity="0.2" filter="blur(16px)"/>

  <!-- Ballon de Basketball Stylisé en Fusion -->
  <circle cx="96" cy="102" r="44" fill="url(#flameGrad)" filter="url(#shadow)"/>
  
  <!-- Lignes du ballon de Basket -->
  <path d="M 52 102 Q 96 102 140 102" stroke="#0B0D14" stroke-width="4" stroke-linecap="round" opacity="0.75" fill="none"/>
  <path d="M 96 58 Q 96 102 96 146" stroke="#0B0D14" stroke-width="4" stroke-linecap="round" opacity="0.75" fill="none"/>
  <path d="M 64 72 Q 96 102 64 132" stroke="#0B0D14" stroke-width="3.5" stroke-linecap="round" opacity="0.65" fill="none"/>
  <path d="M 128 72 Q 96 102 128 132" stroke="#0B0D14" stroke-width="3.5" stroke-linecap="round" opacity="0.65" fill="none"/>

  <!-- Flammes supérieures (Couronne de feu FIRE STONE) -->
  <path d="M 96 28 C 88 44 80 56 86 68 C 76 56 74 46 76 38 C 66 52 64 68 72 82 C 60 76 58 64 60 56 C 50 72 52 92 68 106 C 54 98 48 84 50 74 C 42 90 46 112 62 126 C 56 122 52 114 52 106 C 46 126 62 144 84 148 C 76 142 72 134 74 124 C 82 136 94 142 108 140 C 98 132 96 122 98 114 C 108 126 122 130 136 122 C 128 116 124 108 126 98 C 138 110 148 106 150 94 C 142 96 136 92 134 84 C 144 90 150 82 148 70 C 142 76 134 76 130 70 C 138 64 140 50 132 38 C 128 50 120 56 114 52 C 120 40 114 30 106 24 C 108 36 102 46 94 48 C 98 38 100 30 96 28 Z"
        fill="url(#innerGlow)" opacity="0.85"/>

  <!-- Lettrage "FS" Dynamique au centre -->
  <text x="96" y="112" font-family="'Impact', 'Outfit', sans-serif" font-size="34" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="-1" style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));">
    FS
  </text>
  <text x="96" y="172" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#FFB800" letter-spacing="2">
    FIRE STONE
  </text>
</svg>
