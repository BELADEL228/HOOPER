<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgMaskable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24070B" />
      <stop offset="50%" stop-color="#0B0D14" />
      <stop offset="100%" stop-color="#05060A" />
    </linearGradient>
    <linearGradient id="flameGradMaskable" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF1E32" />
      <stop offset="50%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
    <filter id="shadowMaskable" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF2A3B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fond plein sans coins arrondis (le système applique le masque adaptatif) -->
  <rect width="512" height="512" fill="url(#bgMaskable)"/>

  <!-- Zone de sécurité safe-zone (au sein des 80% centraux soit rayon ~190) -->
  <circle cx="256" cy="256" r="140" fill="#FF2A3B" opacity="0.15" filter="blur(20px)"/>

  <!-- Ballon de Basketball Central -->
  <circle cx="256" cy="256" r="105" fill="url(#flameGradMaskable)" filter="url(#shadowMaskable)"/>

  <!-- Lignes du ballon de Basket -->
  <path d="M 151 256 Q 256 256 361 256" stroke="#090A0F" stroke-width="8" stroke-linecap="round" opacity="0.8" fill="none"/>
  <path d="M 256 151 Q 256 256 256 361" stroke="#090A0F" stroke-width="8" stroke-linecap="round" opacity="0.8" fill="none"/>
  <path d="M 180 182 Q 256 256 180 330" stroke="#090A0F" stroke-width="7" stroke-linecap="round" opacity="0.7" fill="none"/>
  <path d="M 332 182 Q 256 256 332 330" stroke="#090A0F" stroke-width="7" stroke-linecap="round" opacity="0.7" fill="none"/>

  <!-- Monogramme FS -->
  <text x="256" y="278" font-family="'Impact', 'Outfit', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="-2" style="filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));">
    FS
  </text>
  <text x="256" y="398" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="#FFB800" letter-spacing="4">
    FIRE STONE
  </text>
</svg>
